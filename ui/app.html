<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>IPRC1000 遥控器映射</title>
<style>
  :root{
    --bg:#f4f6f9; --card:#ffffff; --line:#e4e8ee; --ink:#0f172a; --sub:#64748b;
    --accent:#2563eb; --accent-soft:#eef4ff; --ok:#16a34a; --warn:#f59e0b;
  }
  *{box-sizing:border-box;-webkit-user-select:none;user-select:none}
  html,body{height:100%;margin:0}
  body{
    background:var(--bg);color:var(--ink);
    font:14px/1.5 "Segoe UI Variable Text","Segoe UI","Microsoft YaHei",system-ui,sans-serif;
    display:flex;flex-direction:column;overflow:hidden;
  }

  /* ── 顶栏 ── */
  header{
    display:flex;align-items:center;gap:8px;padding:12px 18px;
    background:var(--card);border-bottom:1px solid var(--line);flex:none;
  }
  .dot{width:8px;height:8px;border-radius:50%;background:#cbd5e1;flex:none}
  .dot.on{background:var(--ok);box-shadow:0 0 0 3px rgba(22,163,74,.14)}
  /* 学习提示条出现时顶栏会很挤：状态文字先缩（省略号），按钮一律不换行 */
  #status{
    font-size:13px;color:var(--sub);min-width:0;flex:0 1 auto;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .spacer{flex:1;min-width:0}
  .learnbar{
    display:none;align-items:center;gap:8px;font-size:13px;color:#92400e;
    background:#fffbeb;border:1px solid #fde68a;border-radius:8px;padding:4px 10px;
    min-width:0;flex:0 1 auto;
  }
  .learnbar.on{display:flex}
  .learnbar.warn{background:#fef2f2;border-color:#fecaca;color:#b91c1c}
  .learnbar.warn .pulse{background:#dc2626}
  #learntext{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
  #status.bad{color:#b91c1c;font-weight:600}
  .pulse{width:7px;height:7px;border-radius:50%;background:var(--warn);animation:pl 1s infinite;flex:none}
  @keyframes pl{50%{opacity:.25}}
  /* 卡键提示条：遥控器自己连发时的唯一解释窗口 */
  .alertbar{
    display:none;align-items:center;gap:10px;flex:none;
    margin:10px 18px 0;padding:8px 12px;font-size:13px;color:#b91c1c;
    background:#fef2f2;border:1px solid #fecaca;border-radius:10px;
  }
  .alertbar.on{display:flex}
  .alertbar .pulse{background:#dc2626}
  #alerttext{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  button{
    font:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--line);
    background:#fff;color:var(--ink);padding:6px 12px;transition:.13s;
    white-space:nowrap;flex:none;
  }
  button:hover{background:#f6f8fb}
  button:active{transform:translateY(.5px)}
  button:disabled{opacity:.45;cursor:default}
  button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  button.primary:hover{filter:brightness(1.07)}
  button.ghost{border-color:transparent;color:var(--sub)}
  button.ghost:hover{background:#eef1f5;color:var(--ink)}
  button.mini{padding:4px 9px;font-size:12.5px}

  /* ── 主体 ── */
  .shell{flex:1;display:grid;grid-template-columns:330px 1fr;min-height:0}
  .stage{
    background:linear-gradient(180deg,#eef2f7 0%,#e7ecf3 100%);
    border-right:1px solid var(--line);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:10px;padding:14px;min-height:0;position:relative;
  }
  .artwrap{flex:1;min-height:0;width:100%;display:flex;align-items:center;justify-content:center}
  #remote{height:100%;width:100%;display:block;filter:drop-shadow(0 12px 26px rgba(15,23,42,.13))}
  .legend{
    flex:none;display:flex;gap:12px;font-size:11.5px;color:var(--sub);
    background:rgba(255,255,255,.82);border:1px solid var(--line);
    border-radius:8px;padding:5px 9px;
  }
  .legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:4px;vertical-align:-1px}
  .legend .l1{background:var(--accent)}
  .legend .l2{background:var(--warn)}
  .legend .l3{background:#cbd5e1}

  /* ── 遥控器图（照着真机照片画：银灰机身、三列按钮） ── */
  .slot{cursor:pointer;pointer-events:bounding-box}
  .slot .base{fill:#8d9299;stroke:rgba(255,255,255,.5);stroke-width:1}
  .slot .ring{fill:none;stroke:transparent;stroke-width:2.4}
  .slot text{
    text-anchor:middle;dominant-baseline:central;fill:#f3f5f7;
    font:600 9px "Segoe UI Variable Text","Segoe UI",sans-serif;
    pointer-events:none;
  }
  .slot .ic path,.slot .ic rect,.slot .ic circle{stroke:#f3f5f7;fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-width:1.9}
  .slot .ic .fill{fill:#f3f5f7;stroke:none}

  /* 未绑定：浅灰空壳 + 虚线边，一眼看出「这里还没接上」 */
  .slot.empty .base{fill:#c3c7cc;stroke:#7d8289;stroke-width:1;stroke-dasharray:3.5 3}
  .slot.empty text{fill:rgba(45,52,59,.58)}
  .slot.empty .ic path,.slot.empty .ic rect,.slot.empty .ic circle{stroke:rgba(45,52,59,.52)}
  .slot.empty .ic .fill{fill:rgba(45,52,59,.52)}

  /* 已绑定没设动作：琥珀色圈 */
  .slot.set .base{fill:#8d9299;stroke:#fbbf24;stroke-width:2}

  /* 已改键：蓝底白字，一眼能看出来 */
  .slot.mapped .base{fill:#2563eb;stroke:#9dbaff}
  .slot.mapped text{fill:#fff}
  .slot.mapped .ic path,.slot.mapped .ic rect,.slot.mapped .ic circle{stroke:#fff}

  .slot:hover .base{stroke:#fff;stroke-width:1.8}
  .slot.sel .ring{stroke:#0f172a;stroke-width:2.8}
  .slot.flash .base{fill:#7dd3fc!important;stroke:#0ea5e9!important}
  .slot.flash .ic path,.slot.flash .ic rect,.slot.flash .ic circle{stroke:#0b3b53!important}
  .slot.learning .ring{stroke:#fbbf24;stroke-width:3;stroke-dasharray:6 4;animation:spin 6s linear infinite}
  @keyframes spin{to{stroke-dashoffset:-60}}

  /* ── 右侧面板 ── */
  .panel{display:flex;flex-direction:column;min-height:0;background:var(--bg)}
  .ph{padding:18px 22px 12px;flex:none}
  .ptitle{font-size:17px;font-weight:650;letter-spacing:-.01em}
  .psub{font-size:12.5px;color:var(--sub);margin-top:3px;min-height:19px}

  /* 语音桥接状态条 */
  .micbar{
    display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--sub);
    margin-top:9px;padding:6px 10px;border-radius:8px;background:#eef1f5;
  }
  .micbar .mcall{width:7px;height:7px;border-radius:50%;background:#cbd5e1;flex:none}
  .micbar .mcall.on{background:var(--ok);box-shadow:0 0 0 3px rgba(22,163,74,.14)}
  .micbar button{margin-left:auto}
  .pbody{flex:1;overflow:auto;padding:0 22px 12px}
  .pfoot{
    flex:none;display:flex;align-items:center;gap:8px;padding:12px 22px;
    border-top:1px solid var(--line);background:var(--card);
  }
  .row{display:flex;align-items:center;gap:8px;margin-bottom:14px;flex-wrap:wrap}
  .lbl{font-size:12.5px;color:var(--sub);margin-bottom:8px}
  .lbl.inline{margin:0;flex:none}
  code{
    font:12px/1 ui-monospace,Consolas,monospace;color:#334155;background:#e9edf3;
    padding:4px 7px;border-radius:6px;
  }
  .presets{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-bottom:16px}
  .presets button{padding:8px 4px;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .presets button.on{background:var(--accent-soft);border-color:#bfd3fe;color:#1d4ed8;font-weight:600}
  .rec{
    font:12.5px ui-monospace,Consolas,monospace;background:#eef1f5;border-radius:8px;
    padding:7px 12px;min-width:150px;text-align:center;
  }
  .rec.on{background:var(--accent-soft);color:var(--accent);animation:pl 1.1s infinite}
  input[type=text]{
    width:100%;font:inherit;padding:9px 11px;border:1px solid var(--line);
    border-radius:8px;background:#fff;color:var(--ink);-webkit-user-select:text;user-select:text;
  }
  input[type=text]:focus{outline:2px solid #bfd3fe;outline-offset:-1px;border-color:#93b4fd}
  .extras{border-top:1px solid var(--line);padding:12px 22px 16px;flex:none}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
  .chip{
    font:12px ui-monospace,Consolas,monospace;padding:4px 9px;border-radius:7px;
    border:1px solid var(--line);background:#fff;cursor:pointer;color:#475569;
  }
  .chip:hover{border-color:#94a3b8}
  .chip.on{background:var(--accent-soft);border-color:#bfd3fe;color:#1d4ed8}
  .chip.sel{background:#0f172a;color:#fff;border-color:#0f172a}
  .emptyhint{padding:40px 0;text-align:center;color:var(--sub);font-size:13px}
</style>
</head>
<body>

<header>
  <span class="dot" id="dot"></span>
  <span id="status">正在连接遥控器…</span>
  <span class="spacer"></span>
  <div class="learnbar" id="learnbar">
    <span class="pulse"></span>
    <span id="learntext">请按遥控器上的这个键…</span>
    <button class="mini ghost" id="btnSkip" style="display:none">跳过</button>
    <button class="mini ghost" id="btnLearnCancel">取消</button>
  </div>
  <button class="mini" id="btnWizard" title="从最上面那个键开始，一个个按，按完自动跳到下一个">依次绑定剩下的键</button>
  <button class="mini" id="btnRearm" style="display:none"
          title="销毁并重建接管：遥控器按了没反应、或者点过紧急停止之后用">重新接管</button>
  <button class="ghost mini" id="btnPanic" title="万一键盘鼠标不听话，点这里把按键全部还给系统">紧急停止接管</button>
  <button class="ghost mini" id="reset">重置全部</button>
</header>

<div class="alertbar" id="alertbar">
  <span class="pulse"></span>
  <span id="alerttext"></span>
  <span class="spacer"></span>
  <button class="mini ghost" id="btnUnmute">遥控器已恢复，解除暂停</button>
  <button class="mini ghost" id="btnAlertClose">知道了</button>
</div>

<div class="shell">
  <aside class="stage">
    <div class="artwrap">
    <svg id="remote" viewBox="0 0 300 720" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="gbody2" x1="0" y1="0" x2="0.4" y2="1">
          <stop offset="0" stop-color="#d3d6da"/>
          <stop offset=".45" stop-color="#c0c4c9"/>
          <stop offset="1" stop-color="#adb2b7"/>
        </linearGradient>
        <linearGradient id="gedge" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#ffffff" stop-opacity=".8"/>
          <stop offset=".55" stop-color="#ffffff" stop-opacity=".12"/>
          <stop offset="1" stop-color="#ffffff" stop-opacity=".45"/>
        </linearGradient>
      </defs>

      <!-- 机身（细长，圆角） -->
      <rect x="52" y="10" width="192" height="700" rx="30" fill="url(#gbody2)" stroke="#909599" stroke-width="1"/>
      <rect x="58" y="16" width="180" height="688" rx="25" fill="none" stroke="url(#gedge)" stroke-width="1.4"/>

      <!-- 顶部：左边是麦克风开孔（不是按键），右下是电源键（在 slots 里画） -->
      <circle cx="88" cy="65" r="19" fill="#6c7176"/>
      <circle cx="88" cy="65" r="19" fill="none" stroke="#4d5257" stroke-width="1"/>
      <circle cx="88" cy="65" r="13" fill="none" stroke="#9ba1a7" stroke-width="1.5"
              stroke-dasharray="1.6 4.2" opacity=".85"/>
      <!-- 指示灯槽 -->
      <rect x="126" y="35" width="72" height="3" rx="1.5" fill="#9ea4aa" opacity=".5"/>

      <g id="slots"></g>

      <!-- 底部 logo 区 -->
      <rect x="126" y="648" width="36" height="28" rx="6" fill="#f0f2f4" opacity=".95"/>
      <path d="M137 656 h-4.4 v12 h4.4" fill="none" stroke="#8b9096" stroke-width="2.8"
            stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    </div>
    <div class="legend">
      <span><i class="l1"></i>已改键</span>
      <span><i class="l2"></i>已绑定未设动作</span>
      <span><i class="l3"></i>未绑定</span>
    </div>
  </aside>

  <main class="panel">
    <div class="ph">
      <div class="ptitle" id="pName">选一个按键</div>
      <div class="psub" id="pSub">在左边图上点一下你要改的键</div>
      <div class="micbar" id="micbar">
        <span class="mcall" id="micdot"></span>
        <span id="mictext">语音桥接：检查中…</span>
        <button class="mini" id="btnMicStart">启动</button>
      </div>
    </div>

    <div class="pbody">
      <div class="row">
        <span class="lbl inline">绑定到</span>
        <code id="pCode">—</code>
        <button class="mini" id="btnBind">按键确认</button>
        <button class="mini ghost" id="btnUnbind">解绑</button>
      </div>

      <div class="lbl">按下这个键时执行</div>
      <div class="presets" id="presets"></div>

      <div class="row">
        <button id="btnRec">录制快捷键</button>
        <div class="rec" id="recBox">—</div>
        <button class="ghost mini" id="btnRecCancel" style="display:none">取消</button>
      </div>
      <p style="font-size:12px;color:var(--sub);margin:-6px 0 14px">
        录制时请用<b>电脑键盘</b>按组合键；遥控器自己的键不参与录制。
      </p>

      <input type="text" id="txt" placeholder="或者：按下这个键时粘贴一段文字" />
    </div>

    <div class="pfoot">
      <button class="ghost" id="btnNone">不执行</button>
      <span class="spacer"></span>
      <span style="font-size:12px;color:var(--sub)" id="saveHint"></span>
      <button class="primary" id="btnSave" disabled>保存</button>
    </div>

    <div class="extras" id="extras" style="display:none">
      <div class="lbl" style="margin:0">图上没归位的按键（改动作时可以在这里选）</div>
      <div class="chips" id="chips"></div>
    </div>
  </main>
</div>

<script>
/* ───────────── 遥控器图形 ───────────── */
// 照着真机照片画的：三列（左 88 / 中 148 / 右 208），机身 52..244。
// 每个坑位的几何 + 画法。t: c=圆 / r=圆角矩形
const ART = [
  // 顶部右上：电源
  { id:'pwr',   t:'c', x:208, y:59,  r:21, draw:'power' },

  // 第 1 排
  { id:'back',  t:'c', x:88,  y:182, r:23, label:'back', fs:9 },
  { id:'up',    t:'c', x:148, y:182, r:23, draw:'up' },
  { id:'menu',  t:'c', x:208, y:182, r:23, label:'menu', fs:9 },

  // 第 2 排
  { id:'left',  t:'c', x:88,  y:236, r:23, draw:'prev' },
  { id:'ok',    t:'c', x:148, y:236, r:24, label:'ok',   fs:11 },
  { id:'right', t:'c', x:208, y:236, r:23, draw:'next' },

  // 第 3 排
  { id:'exit',  t:'c', x:88,  y:290, r:23, label:'exit', fs:9 },
  { id:'down',  t:'c', x:148, y:290, r:23, draw:'down' },
  { id:'info',  t:'c', x:208, y:290, r:23, label:'info', fs:9 },

  // 第 4 排：收藏 / 语音 / 我的
  { id:'fav',   t:'c', x:88,  y:366, r:22, draw:'heart' },
  { id:'mic',   t:'c', x:148, y:366, r:22, draw:'mic' },
  { id:'me',    t:'c', x:208, y:366, r:22, draw:'me' },

  // 第 5 排：快退 / 播放暂停 / 快进
  { id:'rew',   t:'c', x:88,  y:416, r:22, draw:'rew' },
  { id:'play',  t:'c', x:148, y:416, r:22, draw:'pause' },
  { id:'ffwd',  t:'c', x:208, y:416, r:22, draw:'ffwd' },

  // 第 6 排：左「音量」摇杆 / 静音 + 上频道 / 右「频道」摇杆
  // 摇杆在真机上是一整条，这里拆成上下两个可点区域；名字只标在上半，避免重复。
  { id:'volup',   t:'r', x:62,  y:453, w:52, h:45, rx:20, draw:'plus',  sub:'VOL' },
  { id:'voldown', t:'r', x:62,  y:501, w:52, h:45, rx:20, draw:'minus' },
  { id:'chup',    t:'r', x:182, y:453, w:52, h:45, rx:20, draw:'up',    sub:'CH' },
  { id:'chdown',  t:'r', x:182, y:501, w:52, h:45, rx:20, draw:'down' },

  { id:'mute',  t:'c', x:148, y:478, r:22, draw:'mute' },
  { id:'last',  t:'c', x:148, y:522, r:22, label:'last', fs:9 },
];
const ART_MAP = {}; for (const a of ART) ART_MAP[a.id] = a;

const ICONS = {
  power: '<path d="M0 -7.8 V0.5"/><path d="M-5.9 -4.2 A 7.8 7.8 0 1 0 5.9 -4.2"/>',
  up:    '<path d="M-5.4 3.6 L0 -4.2 L5.4 3.6"/>',
  down:  '<path d="M-5.4 -3.6 L0 4.2 L5.4 -3.6"/>',
  prev:  '<path d="M-7 -5.2 V5.2"/><path d="M6.2 -5.4 L-3.6 0 L6.2 5.4 Z"/>',
  next:  '<path d="M7 -5.2 V5.2"/><path d="M-6.2 -5.4 L3.6 0 L-6.2 5.4 Z"/>',
  heart: '<path d="M0 6.4 C-1.8 4.6 -7.6 1.2 -7.6 -3.1 C-7.6 -6.1 -5.4 -7.6 -3.3 -7.6'
       + ' C-1.7 -7.6 -0.6 -6.7 0 -5.4 C0.6 -6.7 1.7 -7.6 3.3 -7.6'
       + ' C5.4 -7.6 7.6 -6.1 7.6 -3.1 C7.6 1.2 1.8 4.6 0 6.4 Z"/>',
  mic:   '<rect x="-3" y="-8.4" width="6" height="9.2" rx="3"/>'
       + '<path d="M-5.6 -1.2 a 5.6 5.6 0 0 0 11.2 0"/><path d="M0 4.6 V7.4"/>',
  me:    '<circle cx="-1.6" cy="-3.6" r="3.1"/>'
       + '<path d="M-7 6.4 C-7 2.2 -4.4 0.4 -1.6 0.4 C1.2 0.4 3.8 2.2 3.8 6.4"/>'
       + '<path d="M5 -8.6 h4.8 v3.8 h-2.6 l-1.6 1.7 v-1.7 h-0.6 z"/>',
  rew:   '<path d="M-0.6 -5 L-7.2 0 L-0.6 5 Z"/><path d="M7.2 -5 L0.6 0 L7.2 5 Z"/>',
  pause: '<rect class="fill" x="-4.8" y="-5.6" width="3.2" height="11.2" rx="1.2"/>'
       + '<rect class="fill" x="1.6" y="-5.6" width="3.2" height="11.2" rx="1.2"/>',
  ffwd:  '<path d="M0.6 -5 L7.2 0 L0.6 5 Z"/><path d="M-7.2 -5 L-0.6 0 L-7.2 5 Z"/>',
  mute:  '<path d="M-7.4 -2.4 H-4.6 L-0.8 -5.8 V5.8 L-4.6 2.4 H-7.4 Z"/>'
       + '<path d="M2.6 -2.6 L6.8 1.6"/><path d="M6.8 -2.6 L2.6 1.6"/>',
  plus:  '<path d="M-4.8 0 H4.8"/><path d="M0 -4.8 V4.8"/>',
  minus: '<path d="M-4.8 0 H4.8"/>',
};

function shape(a, cls){
  if (a.t === 'c') return `<circle class="${cls}" cx="${a.x}" cy="${a.y}" r="${a.r}"/>`;
  return `<rect class="${cls}" x="${a.x}" y="${a.y}" width="${a.w}" height="${a.h}" rx="${a.rx}"/>`;
}
function buildRemote(){
  const out = [];
  for (const a of ART){
    const cx = a.t === 'c' ? a.x : a.x + a.w / 2;
    const cy = a.t === 'c' ? a.y : a.y + a.h / 2;
    let inner;
    if (a.draw){
      const dy = a.sub ? -6.5 : 0;
      inner = `<g class="ic" transform="translate(${cx},${cy + dy})">${ICONS[a.draw]}</g>`
            + (a.sub
                ? `<text x="${cx}" y="${cy + 11.5}" font-size="7" letter-spacing=".5" opacity=".8">${a.sub}</text>`
                : '');
    } else {
      inner = `<text x="${cx}" y="${cy}" font-size="${a.fs || 11}">${a.label || ''}</text>`;
    }
    out.push(
      `<g class="slot" data-slot="${a.id}">` + shape(a, 'base') + shape(a, 'ring') + inner + '</g>'
    );
  }
  document.getElementById('slots').innerHTML = out.join('');
  document.querySelectorAll('.slot').forEach(g => {
    g.addEventListener('click', () => selectSlot(g.dataset.slot));
  });
}

/* ───────────── 状态 ───────────── */
let A = { slots: [], extras: [], presets: [], connected: false, source: '', learn: null };
let sel = null;                    // { kind:'slot', id } | { kind:'extra', usage }
let cur = { usage: null, action: null };
let wiz = null;                    // 「依次绑定」进度：{ ids: [...], i: 当前第几个 }

const $ = id => document.getElementById(id);

const VN = {8:'Backspace',9:'Tab',13:'Enter',27:'Esc',32:'Space',37:'←',38:'↑',39:'→',40:'↓',
  91:'Win',93:'Menu',160:'LShift',161:'RShift',162:'LCtrl',163:'RCtrl',164:'LAlt',165:'RAlt',
  173:'静音',174:'音量-',175:'音量+',179:'播放/暂停'};
function vkName(v){
  if (VN[v]) return VN[v];
  if (v >= 48 && v <= 57) return String(v - 48);
  if (v >= 65 && v <= 90) return String.fromCharCode(v);
  if (v >= 112 && v <= 135) return 'F' + (v - 111);
  return 'VK' + (+v).toString(16).toUpperCase();
}
function keyLabel(keys){
  if (!keys || !keys.length) return '—';
  const m = [], rest = [];
  for (const k of keys){
    if (k === 17) m.push('Ctrl');
    else if (k === 18) m.push('Alt');
    else if (k === 16) m.push('Shift');
    else if (k === 91) m.push('Win');
    else rest.push(vkName(k));
  }
  return [...m, ...rest].join('+');
}
function fmt(action){
  if (!action) return '未设置';
  if (action.type === 'keys') return keyLabel(action.keys);
  if (action.type === 'voice') return '按住说话 · ' + keyLabel(action.keys);
  if (action.type === 'text') return '粘贴：' + (action.text || '').slice(0, 26);
  if (action.type === 'none') return '不执行';
  if (action.type === 'native') return '系统原生（原样放行）';
  return '?';
}
const hex = u => '0x' + (+u).toString(16).padStart(2, '0').toUpperCase();

async function load(){
  try {
    A = await (await fetch('/api/app')).json();
  } catch (e) { return; }
  window.A_DEBUG = A;   // 自检脚本要读，正常使用无影响
  paintStatus();
  paintAlert();
  paintRemote();
  paintChips();
  paintPanel();
  loadMic();
}

function paintStatus(){
  $('dot').className = 'dot' + (A.connected ? ' on' : '');
  const stopping = A.intercept && A.intercept.phase === 'stopping';
  const configPending = A.intercept && A.intercept.active && A.intercept.requestedVersion !== A.intercept.appliedVersion;
  const mode = A.diagnostic ? ' · 诊断模式（不接管、不注入）'
             : stopping ? ' · 注入已停止，正在等待接管线程退出'
             : A.panic ? ' · 接管已紧急停止（按键已交还系统）'
             : A.source === 'intercept' ? ' · 接管模式（按键已被拦下，不会打字）'
             : A.source === 'hid' ? ' · 直读模式'
             : A.source === 'raw' ? ' · 观察模式（不执行映射，原始按键仍会打字）'
             : '';
  // 装了驱动却没接管：这是最难受的状态 —— 按键会照常打进窗口（满屏 m），
  // 同时还被我们派发一次。必须显眼地说出来，否则用户只会觉得「程序坏了」。
  const needArm = A.connected && !A.diagnostic && !A.panic && A.intercept && A.intercept.dll && A.source !== 'intercept';
  const stalled = !!(A.intercept && A.intercept.stalled);
  $('status').textContent = (A.connected ? '遥控器已连接' : '遥控器未连接 · 按任意键唤醒') + mode
    + (configPending ? ' · 正在应用按键配置…' : '')
    + (stalled ? ' · 接管线程无响应，正在自动重建' : '')
    + (needArm ? ' · 接管失效，按键会直接打字（正在自动重试）' : '');
  $('status').classList.toggle('bad', !!(needArm || stalled));

  // 「重新接管」只在真的需要时出现，平时不占地方
  $('btnRearm').style.display = (A.panic || stalled || needArm) ? '' : 'none';

  const lb = $('learnbar');
  if (A.learn){
    const s = A.slots.find(x => x.id === A.learn);
    let t = `请按一下遥控器上的「${s ? s.name : A.learn}」键…`;
    if (wiz) t = `第 ${wiz.i + 1} / ${wiz.ids.length} 个 —— ` + t;
    $('learntext').textContent = t;
    $('btnSkip').style.display = wiz ? '' : 'none';
    lb.classList.add('on');
  } else {
    $('btnSkip').style.display = 'none';
    lb.classList.remove('on', 'warn');
  }
  paintWizBtn();
}

// 卡键提示条：遥控器自己连发的时候，用户唯一的解释窗口。
// SSE 推过来立刻弹；刷新页面之后靠 A.muted 还原，不至于「程序看着正常，其实在瞎发」。
function paintAlert(){
  const muted = (A && A.muted) || [];
  const bar = $('alertbar');
  if (!muted.length){ bar.classList.remove('on'); return; }
  const n = muted.map(x => x.hex).join('、');
  $('alerttext').textContent =
    `${n} 在几秒内自动连发了好几次（像按键卡住了），已经暂停派发。` +
    `取下电池再装回，然后点「已恢复」。`;
  bar.classList.add('on');
}
$('btnUnmute').onclick = async () => {
  await fetch('/api/unmute', { method: 'POST' });
  $('alertbar').classList.remove('on');
  load();
};
$('btnAlertClose').onclick = () => $('alertbar').classList.remove('on');

// 头部那个「依次绑定」按钮：随时反映还剩几个没绑
function paintWizBtn(){
  const b = $('btnWizard');
  const n = A.slots.filter(s => s.usage === null).length;
  b.disabled = n === 0 || !!wiz;
  b.textContent = wiz ? `绑定中（${wiz.i + 1}/${wiz.ids.length}）`
                : n ? `依次绑定剩下的 ${n} 个键`
                : '全部按键都已绑定';
}

/* ───────── 语音桥接（遥控器麦克风 → 系统录音设备） ─────────
   遥控器的声音走蓝牙专有通道，Windows 直接看不到；只能靠 ETW 抓 HCI 再解成 PCM，
   由 mic_live.py 播进虚拟声卡 CABLE Input，系统的「CABLE Output」就成了遥控器麦克风。 */
let micInfo = { running: false, cable: true };

async function loadMic(){
  try { micInfo = await (await fetch('/api/mic')).json(); }
  catch { return; }
  paintMic();
}

function paintMic(){
  const dot = $('micdot'), txt = $('mictext'), btn = $('btnMicStart');
  if (!micInfo.cable){
    dot.className = 'mcall';
    txt.textContent = '没装 VB-CABLE，这条路走不通（先跑 install-vbcable.cmd）';
    btn.style.display = 'none';
    return;
  }
  dot.className = 'mcall' + (micInfo.running ? ' on' : '');
  txt.textContent = micInfo.running
    ? '语音桥接：运行中 —— 遥控器说话已经接到「CABLE Output」'
    : '语音桥接：未启动 —— 不启动就听不到遥控器说话';
  btn.style.display = micInfo.running ? 'none' : '';
}

$('btnMicStart').onclick = async () => {
  $('btnMicStart').disabled = true;
  $('mictext').textContent = '正在启动…（会弹 UAC，请点「是」）';
  await fetch('/api/mic/start', { method: 'POST' });
  // 桥要先提权、再起 ETW、再打开声卡，正常 2~5 秒
  for (let i = 0; i < 15; i++){
    await new Promise(r => setTimeout(r, 1000));
    await loadMic();
    if (micInfo.running) break;
  }
  $('btnMicStart').disabled = false;
  paintMic();
};

function paintRemote(){
  const byId = {};
  for (const s of A.slots) byId[s.id] = s;
  document.querySelectorAll('.slot').forEach(g => {
    const s = byId[g.dataset.slot];
    g.classList.remove('empty', 'set', 'mapped', 'sel', 'learning');
    if (!s || s.usage === null) g.classList.add('empty');
    else if (s.action) g.classList.add('mapped');
    else g.classList.add('set');
    if (sel && sel.kind === 'slot' && sel.id === g.dataset.slot) g.classList.add('sel');
    if (A.learn === g.dataset.slot) g.classList.add('learning');
  });
}

function paintChips(){
  const box = $('chips');
  const ex = $('extras');
  box.innerHTML = '';
  if (!A.extras.length){ ex.style.display = 'none'; return; }
  ex.style.display = 'block';
  for (const e of A.extras){
    const b = document.createElement('div');
    b.className = 'chip' + (e.action ? '' : '');
    b.textContent = e.hex + (e.action ? ' · ' + fmt(e.action) : '');
    if (sel && sel.kind === 'extra' && sel.usage === e.usage) b.classList.add('sel');
    b.onclick = () => selectExtra(e.usage);
    box.appendChild(b);
  }
}

function paintPanel(){
  const btnSave = $('btnSave');
  if (!sel){
    $('pName').textContent = '选一个按键';
    $('pSub').textContent = '在左边图上点一下你要改的键';
    $('pCode').textContent = '—';
    $('btnBind').disabled = true;
    $('btnUnbind').disabled = true;
    $('btnRec').disabled = true;
    $('recBox').textContent = '—';
    $('txt').value = '';
    $('saveHint').textContent = '';
    btnSave.disabled = true;
    paintPresets();
    return;
  }

  if (sel.kind === 'slot'){
    const s = A.slots.find(x => x.id === sel.id);
    if (!s) { sel = null; return paintPanel(); }
    $('pName').textContent = s.name;
    $('pCode').textContent = s.usage === null ? '未绑定' : hex(s.usage);
    $('pSub').textContent = s.usage === null
      ? '还没绑定按键 —— 点「按键确认」，然后按一下遥控器上的这个键'
      : (s.count ? `已按过 ${s.count} 次` : '已绑定，还没按过');
    $('btnBind').disabled = false;
    $('btnUnbind').disabled = s.usage === null;
    $('btnRec').disabled = s.usage === null;
  } else {
    const e = A.extras.find(x => x.usage === sel.usage);
    if (!e) { sel = null; return paintPanel(); }
    $('pName').textContent = '未归位按键 ' + e.hex;
    $('pCode').textContent = e.hex;
    $('pSub').textContent = '这个键在遥控器图上没有位置，但同样可以设动作';
    $('btnBind').disabled = true;
    $('btnUnbind').disabled = true;
    $('btnRec').disabled = false;
  }

  $('recBox').textContent = fmt(cur.action);
  $('recBox').classList.remove('on');
  $('txt').value = cur.action && cur.action.type === 'text' ? cur.action.text : '';
  $('saveHint').textContent = '';
  btnSave.disabled = cur.usage === null;
  paintPresets();
}

async function cancelLearn(){
  if (!A.learn) return;
  await fetch('/api/bind', {
    method:'POST', headers:{ 'Content-Type':'application/json' },
    body: JSON.stringify({ slot: A.learn, cancel: true }),
  });
  await load();
}

/* ───────── 依次绑定向导 ─────────
   16 个空位一个个点、再一个个按，太麻烦。这里从最上面那个空位开始，
   按下一个键就自动跳到下一个，直到全部绑完（或用户跳过/取消）。 */
function wizStart(){
  if (wiz) return;
  const ids = A.slots.filter(s => s.usage === null).map(s => s.id);
  if (!ids.length) return;
  wiz = { ids, i: 0 };
  wizStep();
}

async function wizStep(){
  if (!wiz) return;
  if (wiz.i >= wiz.ids.length) return wizDone();
  const id = wiz.ids[wiz.i];
  selectSlot(id, true);
  paintStatus();
  await fetch('/api/bind', {
    method:'POST', headers:{ 'Content-Type':'application/json' },
    body: JSON.stringify({ slot: id, learn: true }),
  });
  await load();
  selectSlot(id, true);
  paintStatus();
}

function wizSkip(){
  if (!wiz) return;
  wiz.i++;
  wizStep();
}

async function wizStop(){
  if (!wiz) return;
  wiz = null;
  await fetch('/api/bind', {
    method:'POST', headers:{ 'Content-Type':'application/json' },
    body: JSON.stringify({ slot: 'pwr', cancel: true }),
  });
  await load();
}

function wizDone(){
  wiz = null;
  load();
}

function selectSlot(id, quiet){
  const s = A.slots.find(x => x.id === id);
  if (!s) return;
  // 向导内部切换坑位时不要去取消自己刚发出去的学习请求
  if (!quiet && A.learn && A.learn !== id) cancelLearn();
  sel = { kind: 'slot', id };
  cur = { usage: s.usage, action: s.action ? JSON.parse(JSON.stringify(s.action)) : null };
  paintRemote(); paintChips(); paintPanel();
}
function selectExtra(usage){
  const e = A.extras.find(x => x.usage === usage);
  if (!e) return;
  if (A.learn) cancelLearn();
  sel = { kind: 'extra', usage };
  cur = { usage, action: e.action ? JSON.parse(JSON.stringify(e.action)) : null };
  paintRemote(); paintChips(); paintPanel();
}

// 学习中途按 Esc 收手（向导中途就是整个取消）
window.addEventListener('keydown', ev => {
  if (ev.key !== 'Escape') return;
  if (wiz){ ev.preventDefault(); wizStop(); return; }
  if (A.learn){ ev.preventDefault(); cancelLearn(); }
});

/* ───────────── 预设 ───────────── */
function presetAction(id){
  const m = {
    enter: { type:'keys', keys:[13] }, esc: { type:'keys', keys:[27] }, backspace: { type:'keys', keys:[8] },
    up: { type:'keys', keys:[38] }, down: { type:'keys', keys:[40] }, left: { type:'keys', keys:[37] },
    right: { type:'keys', keys:[39] }, tab: { type:'keys', keys:[9] },
    volup: { type:'keys', keys:[175] }, voldown: { type:'keys', keys:[174] },
    mute: { type:'keys', keys:[173] }, playpause: { type:'keys', keys:[179] },
    winl: { type:'keys', keys:[91,76] }, wind: { type:'keys', keys:[91,68] },
    snipping: { type:'keys', keys:[91,16,83] },
    ralt_voice: { type:'voice', keys:[165] }, ctrlwin_voice: { type:'voice', keys:[17,91] },
    dictate: { type:'keys', keys:[91,72] },
    dictate_wb: { type:'keys', keys:[17,68] },
    none: { type:'none' },
  };
  return JSON.parse(JSON.stringify(m[id] || { type:'none' }));
}
function paintPresets(){
  const box = $('presets');
  box.innerHTML = '';
  for (const p of A.presets){
    const b = document.createElement('button');
    b.textContent = p.name;
    const act = presetAction(p.id);
    const same = cur.action && JSON.stringify(act) === JSON.stringify(cur.action);
    if (same) b.classList.add('on');
    b.onclick = () => {
      stopRec();
      cur.action = act;
      $('recBox').textContent = fmt(cur.action);
      $('recBox').classList.remove('on');
      $('txt').value = '';
      paintPresets();
    };
    box.appendChild(b);
  }
}

/* ───────────── 录制快捷键（浏览器 + 服务端双通道） ───────────── */
const REC_MODS = new Set([16,17,18,91,92,160,161,162,163,164,165]);
let rec = null, recCool = 0;

function setRecUI(on, text){
  const box = $('recBox');
  if (text !== undefined) box.textContent = text;
  box.classList.toggle('on', !!on);
  const b = $('btnRec');
  b.disabled = !!on;
  b.textContent = on ? '正在录制…' : '录制快捷键';
  $('btnRecCancel').style.display = on ? '' : 'none';
}
function stopRec(){
  const was = !!rec;
  if (rec){
    window.removeEventListener('keydown', rec.onKey, true);
    try { rec.controller.abort(); } catch (e) {}
    rec = null;
  }
  if (was) recCool = Date.now() + 300;
  if (was) fetch('/api/capture/cancel', { method: 'POST' }).catch(() => {});
  setRecUI(false);
}
$('btnRecCancel').onclick = () => { stopRec(); paintPanel(); };

$('btnRec').onclick = (e) => {
  e.preventDefault();
  if (rec || Date.now() < recCool || cur.usage === null) return;
  try { e.currentTarget.blur(); } catch (err) {}

  const box = $('recBox');
  const mods = new Set();
  const controller = new AbortController();

  const finish = keys => {
    if (!rec) return;
    const got = (keys && keys.length) ? keys : null;
    stopRec();
    if (got){
      cur.action = { type:'keys', keys: got };
      box.textContent = keyLabel(got);
    } else {
      box.textContent = fmt(cur.action);
    }
    paintPresets();
  };

  const onKey = ev => {
    if (!rec) return;
    const vk = ev.keyCode || ev.which;
    if (vk === 27){ ev.preventDefault(); ev.stopPropagation(); finish(null); return; }
    if (!vk) return;
    ev.preventDefault(); ev.stopPropagation();
    if (REC_MODS.has(vk)){
      if (!mods.has(vk)){
        mods.add(vk);
        box.textContent = '按住 ' + keyLabel([...mods]) + '… 再按主键';
      }
      return;
    }
    finish([...mods, vk]);
  };

  rec = { onKey, controller };
  setRecUI(true, '按下组合键…（Esc 取消）');
  window.focus();
  window.addEventListener('keydown', onKey, true);

  fetch('/api/capture', { method:'POST', signal: controller.signal })
    .then(r => r.json())
    .then(r => { if (rec && r && r.keys && r.keys.length) finish(r.keys); })
    .catch(() => {});

  setTimeout(() => { if (rec) finish(null); }, 20000);
};

/* ───────────── 保存 / 绑定 ───────────── */
$('btnSave').onclick = async () => {
  if (cur.usage === null) return;
  const t = $('txt').value.trim();
  const action = t ? { type:'text', text:t } : (cur.action || { type:'none' });
  await fetch('/api/action', {
    method:'POST', headers:{ 'Content-Type':'application/json' },
    body: JSON.stringify({ usage: cur.usage, action }),
  });
  await load();
  if (sel && sel.kind === 'slot') selectSlot(sel.id);
  $('saveHint').textContent = '已保存';
  setTimeout(() => { if ($('saveHint')) $('saveHint').textContent = ''; }, 1600);
};
$('btnNone').onclick = () => {
  stopRec();
  cur.action = { type:'none' };
  $('recBox').textContent = '不执行';
  $('recBox').classList.remove('on');
  $('txt').value = '';
  paintPresets();
};
$('btnBind').onclick = async () => {
  if (!sel || sel.kind !== 'slot') return;
  await fetch('/api/bind', {
    method:'POST', headers:{ 'Content-Type':'application/json' },
    body: JSON.stringify({ slot: sel.id, learn: true }),
  });
  await load();
};
$('btnWizard').onclick = () => { sel = null; wizStart(); };
$('btnSkip').onclick = () => wizSkip();
$('btnLearnCancel').onclick = async () => {
  if (wiz) return wizStop();
  await fetch('/api/bind', {
    method:'POST', headers:{ 'Content-Type':'application/json' },
    body: JSON.stringify({ slot: sel && sel.id ? sel.id : 'pwr', cancel: true }),
  });
  await load();
};
$('btnUnbind').onclick = async () => {
  if (!sel || sel.kind !== 'slot') return;
  if (!confirm('把这个位置和按键解绑？（动作设置会保留）')) return;
  await fetch('/api/bind', {
    method:'POST', headers:{ 'Content-Type':'application/json' },
    body: JSON.stringify({ slot: sel.id, usage: null }),
  });
  await load();
  selectSlot(sel.id);
};
$('reset').onclick = async () => {
  if (!confirm('清空所有按键的动作设置？（图上位置和绑定会保留）')) return;
  await fetch('/api/reset', { method:'POST' });
  await load();
};
$('btnPanic').onclick = async () => {
  // Emergency actions must not wait behind a confirmation dialog.
  $('btnPanic').disabled = true;
  try {
    const response = await fetch('/api/panic', { method: 'POST' });
    const result = await response.json();
    if (!response.ok) alert(result.reason || '接管线程尚未确认停止，请退出程序');
  } finally { $('btnPanic').disabled = false; await load(); }
};
// 遥控器按了没反应时的一键急救：销毁旧上下文、重新抢一次接管
$('btnRearm').onclick = async () => {
  $('btnRearm').disabled = true;
  await fetch('/api/rearm', { method: 'POST' });
  await new Promise(r => setTimeout(r, 900));
  await load();
  $('btnRearm').disabled = false;
};

/* ───────────── 实时事件 ───────────── */
function flash(usage){
  const s = A.slots.find(x => x.usage === usage);
  if (s){
    const g = document.querySelector('.slot[data-slot="' + s.id + '"]');
    if (g){
      g.classList.add('flash');
      setTimeout(() => g.classList.remove('flash'), 260);
    }
  }
}

let reloadTimer = null;
function reloadSoon(){
  clearTimeout(reloadTimer);
  reloadTimer = setTimeout(async () => {
    await load();
    if (sel && sel.kind === 'extra') selectExtra(sel.usage);
  }, 90);
}

const es = new EventSource('/api/events');
es.onmessage = e => {
  let m; try { m = JSON.parse(e.data); } catch { return; }
  if (m.type === 'key' && m.down){ flash(m.usage); reloadSoon(); }
  else if (m.type === 'state') reloadSoon();
  else if (m.type === 'device') load();
  else if (m.type === 'learn-done'){
    if (wiz){                       // 向导里：绑好一个就自动跳到下一个
      wiz.i++;
      load().then(() => { if (wiz) wizStep(); });
    } else {
      load().then(() => selectSlot(m.slot));
    }
  }
  else if (m.type === 'learn-dup'){
    // 按错键了（这个码已经属于别的坑位）：不覆盖，继续等正确的那个
    const lb = $('learnbar');
    lb.classList.add('on', 'warn');
    $('learntext').textContent =
      `这个键已经绑在「${m.owner}」了，请按别的键…`;
    $('btnSkip').style.display = wiz ? '' : 'none';
  }
  else if (m.type === 'stuck'){
    const bar = $('alertbar');
    $('alerttext').textContent =
      `${m.hex} 键在几秒内以几乎相同的间隔连发了好几次（像卡住了），` +
      `已经暂停它 ${Math.round((m.ms || 30000) / 1000)} 秒，期间不会注入任何按键。` +
      `取下电池再装回，然后点「已恢复」。`;
    bar.classList.add('on');
    reloadSoon();
  }
  else if (m.type === 'stuck-clear'){
    $('alertbar').classList.remove('on');
  }
};

es.onerror = () => { /* 服务重启时自动重连，不弹错 */ };

buildRemote();
load();
setInterval(load, 4000);   // 兜底轮询：SSE 断了也不会显示过期状态

// 自检用：没有真遥控器时，往界面里塞一条服务端消息（格式和 SSE 一致），
// 好把向导「绑好一个 → 自动跳下一个」以及按错键被拒的流程测通。正常使用无影响。
window.__iprcSim = msg => es.onmessage({ data: JSON.stringify(msg) });
</script>
</body>
</html>
